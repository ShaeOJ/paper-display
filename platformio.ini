; paper-display — Bitaxe (AxeOS) stats on a 2.9" B/W e-paper.
;
; Hardware: Waveshare e-Paper ESP8266 Driver Board (ESP-12F, 4MB, CP2102)
; with a 2.9" 296x128 B/W panel (Heltec Meshtastic panel confirmed working).
[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
upload_port = COM7
upload_speed = 460800
board_build.filesystem = littlefs
lib_deps =
    zinggjm/GxEPD2@^1.5.8
    bblanchon/ArduinoJson@^6.21.5
    https://github.com/tzapu/WiFiManager.git
